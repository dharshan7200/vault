<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault - Local Secure Media Storage</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="icon" href="favicon.png">
</head>

<body>
    <div id="app">
        <!-- Auth Screen (Shared for Setup and Login) -->
        <section id="auth-screen" class="screen hidden">
            <!-- Animated Background Elements -->
            <div class="glow-orb orb-1"></div>
            <div class="glow-orb orb-2"></div>
            <div class="glow-orb orb-3"></div>
            
            <div class="glass-card">
                <h1 id="auth-title">Unlock Vault</h1>
                <p id="auth-desc">Enter the master PIN to access files.</p>
                <div class="password-container">
                    <input type="password" id="password-input" placeholder="Enter master password" class="glass-input" />
                    <button class="action-btn primary-btn" id="submit-btn" style="margin-top: 10px; width: 100%;">Unlock</button>
                </div>
                <p id="auth-error" class="error-msg hidden">Invalid PIN. Try again.</p>
            </div>
        </section>
        <!-- Vault Dashboard -->
        <section id="vault-screen" class="screen hidden">
            <header>
                <div class="header-content">
                    <h1>Private Vault</h1>
                    <div class="header-actions">
                        <button id="logout-btn" class="icon-btn" title="Lock Vault">🔒</button>
                        <button id="new-folder-btn" class="secondary-btn">New Folder</button>
                        <label for="file-upload" class="primary-btn">
                            <span>Upload Files</span>
                            <input type="file" id="file-upload" multiple accept="image/*,video/*" class="hidden">
                        </label>
                    </div>
                </div>
            </header>

            <div class="caution-banner">
                <span class="caution-icon">⚠️</span>
                <p>Clearing your browser cache or site data for this site will <strong>PERMANENTLY DELETE</strong> all
                    your stored files.</p>
            </div>

            <main>
                <nav id="breadcrumbs" class="breadcrumbs">
                    <span class="breadcrumb-item" data-id="root">Root</span>
                </nav>
                <div id="bulk-actions" class="bulk-actions">
                    <button id="select-all-btn" class="secondary-btn">Select All</button>
                    <button id="export-selected-btn" class="primary-btn">Download Selected (ZIP)</button>
                    <button id="delete-selected-btn" class="danger-btn">Delete Selected</button>
                    <button id="clear-selection-btn" class="secondary-btn">Clear Selection</button>
                </div>
                <div id="file-list" class="grid">
                    <!-- Files will be rendered here -->
                </div>
                <div id="empty-state" class="empty-state hidden">
                    <div class="empty-icon">📂</div>
                    <p>No files in your vault yet. Upload some images or videos!</p>
                </div>
                <div id="storage-info" class="storage-text">Calculating storage...</div>
            </main>
        </section>

        <!-- Preview Modal -->
        <div id="preview-modal" class="modal hidden">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <button id="close-preview" class="close-btn">&times;</button>
                <button id="prev-btn" class="nav-btn left">&lsaquo;</button>
                <div id="media-viewport"></div>
                <button id="next-btn" class="nav-btn right">&rsaquo;</button>
                <div class="modal-footer">
                    <span id="preview-filename"></span>
                    <div class="modal-actions">
                        <button id="export-btn" class="secondary-btn">Export</button>
                        <button id="delete-btn" class="danger-btn">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="jszip-secure.js"></script>
    <script src="crypto.js"></script>
    <script src="db.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>

</html>
